apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lab-app
  template:
    metadata:
      labels:
        app: lab-app
    spec:
      containers:
      - name: lab-app
        image: lab-app:v2.3.0
        ports:
        - containerPort: 3000
        env:
        - name: API_KEY
          value: "my-secret-api-key" 
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-key-secret
              key: api-key
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
